server {
    listen 4016;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all unknown paths serve index.html so react-router-dom handles routing
    location / {
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://sentry.io https://js.posthog.com https://finance-api.endabelyu.com https://fonts.googleapis.com;";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
