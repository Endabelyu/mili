name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bunx tsc -b

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build

  deploy-production:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Build
        run: |
          bun install
          bun run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_CONTABO }}
          username: ${{ secrets.VPS_USERNAME_CONTABO }}
          key: ${{ secrets.VPS_SSHKEY_CONTABO }}
          port: ${{ secrets.VPS_PORT_CONTABO || '22' }}
          source: "package.json,bun.lock,src/,public/,index.html,vite.config.ts,tsconfig.json,tsconfig.app.json,tsconfig.node.json,eslint.config.js,docker-compose.yml,Dockerfile,nginx.conf"
          target: ${{ secrets.VPS_TARGET_DIR }}/web/
          overwrite: true

      - name: Deploy & Verify on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CONTABO }}
          username: ${{ secrets.VPS_USERNAME_CONTABO }}
          key: ${{ secrets.VPS_SSHKEY_CONTABO }}
          port: ${{ secrets.VPS_PORT_CONTABO || '22' }}
          script: |
            cd ${{ secrets.VPS_TARGET_DIR }}/web
            cp ../.env . 2>/dev/null || true
            docker compose build --no-cache
            docker compose up -d --force-recreate
            docker image prune -f
            echo "Waiting 5 seconds for healthcheck..."
            sleep 5
            # Verify the service is running
            if [ "$(docker compose ps --format json | grep -c Running)" -ge 1 ]; then
              echo "✅ Frontend container is running."
            else
              echo "❌ Frontend container failed to start."
              docker compose logs
              exit 1
            fi
