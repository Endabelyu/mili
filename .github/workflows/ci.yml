name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  deploy-production:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_CONTABO }}
          username: ${{ secrets.VPS_USERNAME_CONTABO }}
          key: ${{ secrets.VPS_SSHKEY_CONTABO }}
          port: ${{ secrets.VPS_PORT_CONTABO || '22' }}
          source: "package.json,package-lock.json,src/,public/,index.html,vite.config.ts,tsconfig.json,tsconfig.app.json,tsconfig.node.json,eslint.config.js,docker-compose.yml,Dockerfile,nginx.conf"
          target: ${{ secrets.VPS_TARGET_DIR }}/web/
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CONTABO }}
          username: ${{ secrets.VPS_USERNAME_CONTABO }}
          key: ${{ secrets.VPS_SSHKEY_CONTABO }}
          port: ${{ secrets.VPS_PORT_CONTABO || '22' }}
          script: |
            cd ${{ secrets.VPS_TARGET_DIR }}/web
            cp ../.env . 2>/dev/null || true
            docker compose up -d --build --force-recreate
            docker image prune -f
